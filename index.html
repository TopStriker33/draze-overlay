<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
html,body{width:1280px;height:720px;overflow:hidden;background:transparent;}
#stage{position:fixed;inset:0;}

/* ---- ONLYFANS BADGE (bottom-RIGHT) ---- */
#of{position:absolute;right:24px;top:24px;display:inline-flex;align-items:center;gap:13px;padding:12px 24px 12px 16px;border-radius:18px;white-space:nowrap;background:#fff;box-shadow:0 7px 24px rgba(0,150,214,.55);animation:float 2.8s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#of::after{content:"";position:absolute;inset:-3px;border-radius:20px;border:3px solid #00AFF0;opacity:0;animation:ring 2.8s ease-out infinite;}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.16);opacity:0}}
#of .mark{width:40px;height:40px;flex:none;}
#of .tx{display:flex;flex-direction:column;line-height:1.08;}
#of .brand{font-size:14px;font-weight:800;letter-spacing:-.2px;}
#of .brand .o{color:#0a1f2e;}#of .brand .f{color:#00AFF0;}
#of .user{font-size:20px;font-weight:900;color:#0a1f2e;letter-spacing:-.3px;}
#of .free{margin-left:8px;background:#00AFF0;color:#fff;font-weight:900;font-size:12px;padding:4px 11px;border-radius:999px;box-shadow:0 0 10px rgba(0,175,240,.7);}

/* ---- TELEGRAM PILL (bottom-LEFT) ---- */
#tg{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:11px;padding:11px 20px 11px 13px;border-radius:16px;white-space:nowrap;background:#fff;box-shadow:0 6px 18px rgba(41,169,235,.5);}
#tg svg{width:36px;height:36px;flex:none;}
#tg .tx{display:flex;flex-direction:column;line-height:1.08;}
#tg .brand{font-size:13px;font-weight:800;color:#29a9eb;letter-spacing:.2px;}
#tg .user{font-size:18px;font-weight:900;color:#0a1f2e;letter-spacing:-.3px;}
</style></head><body>
<div id="stage">
  <div id="of">
    <svg class="mark" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 4.003h-4.015c-3.45 0-5.3.197-6.748 1.957a7.996 7.996 0 1 0 2.103 9.211c3.182-.231 5.39-2.134 6.085-5.173 0 0-2.399.585-4.43 0 4.018-.777 6.333-3.037 7.005-5.995zM5.61 11.999A2.391 2.391 0 0 1 9.28 9.97a2.966 2.966 0 0 1 2.998-2.528h.008c-.92 1.778-1.407 3.352-1.998 5.263A2.392 2.392 0 0 1 5.61 12Zm2.386-7.996a7.996 7.996 0 1 0 7.996 7.996 7.996 7.996 0 0 0-7.996-7.996Zm0 10.394A2.399 2.399 0 1 1 10.395 12a2.396 2.396 0 0 1-2.399 2.398Z" fill="#00AFF0"/></svg>
    <span class="tx"><span class="brand"><span class="o">Only</span><span class="f">Fans</span></span><span class="user">@alicerosex</span></span>
    <span class="free">FREE</span>
  </div>
  <div id="tg">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="12" fill="#29a9eb"/>
      <path d="M5.4 11.7l11.3-4.4c.5-.2 1 .1.8.9l-1.9 9.1c-.1.6-.5.7-1 .4l-2.8-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-3 5.2-4.7c.2-.2 0-.3-.3-.1L8.3 13 5.6 12.2c-.6-.2-.6-.6.1-.9z" fill="#fff"/>
    </svg>
    <span class="tx"><span class="brand">Telegram</span><span class="user">my circle 🥺</span></span>
  </div>
</div>
</body></html>
