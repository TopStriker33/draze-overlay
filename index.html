<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
html,body{width:1280px;height:720px;overflow:hidden;background:transparent;}
#stage{position:fixed;inset:0;}

/* ---- LOVENSE MENU (top-left) ---- */
#lp{position:absolute;top:20px;left:20px;width:262px;background:linear-gradient(165deg,#04243a 0%,#020a12 100%);border:2px solid #00AFF0;border-radius:15px;box-shadow:0 0 26px rgba(0,175,240,.85);padding:11px 14px 13px;}
#lp h1{margin:0;text-align:center;font-size:21px;letter-spacing:3px;color:#4fd2ff;text-shadow:0 0 11px #00AFF0;font-weight:900;display:flex;align-items:center;justify-content:center;gap:7px;}
#lp h1 .hrt{font-size:16px;color:#00AFF0;animation:beat 1s infinite;}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.sub{text-align:center;font-size:10px;letter-spacing:4px;color:#9fe3ff;margin:2px 0 8px;font-weight:bold;}
.hdr{display:flex;justify-content:space-around;padding-bottom:7px;margin-bottom:2px;border-bottom:1px solid rgba(0,175,240,.4);}
.hdr .ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#00AFF0,#005f8a);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 0 9px rgba(0,175,240,.9);color:#fff;}
.row{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;border-bottom:1px solid rgba(0,175,240,.13);}
.row:last-child{border-bottom:none;}
.tk{color:#4fd2ff;font-size:16px;font-weight:bold;width:88px;}
.sec{color:#9fe3ff;font-size:16px;font-weight:bold;width:38px;text-align:center;}
.lvl{display:flex;gap:2px;align-items:flex-end;height:18px;width:42px;justify-content:flex-end;}
.lvl i{width:5px;background:linear-gradient(#cdefff,#00AFF0);border-radius:2px;box-shadow:0 0 5px #00AFF0;animation:pulse 1.1s infinite;}
.lvl i:nth-child(2){animation-delay:.15s}.lvl i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ---- PINK LINK CTA (top-right) ---- */
#cta{position:absolute;top:26px;right:30px;text-align:right;color:#fff;font-weight:900;font-size:25px;line-height:1.18;text-shadow:0 2px 7px rgba(0,0,0,.7);letter-spacing:.5px;}
#cta .pink{color:#ff2d95;text-shadow:0 0 12px rgba(255,45,149,.85);animation:glow 1.4s infinite;}
@keyframes glow{0%,100%{text-shadow:0 0 8px rgba(255,45,149,.6)}50%{text-shadow:0 0 18px rgba(255,45,149,1)}}

/* ---- ONLYFANS BADGE (bottom-left, real logo + username, ANIMATED) ---- */
#of{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:13px;padding:12px 24px 12px 16px;border-radius:18px;white-space:nowrap;background:#fff;box-shadow:0 7px 24px rgba(0,150,214,.55);animation:float 2.6s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
#of::after{content:"";position:absolute;inset:-3px;border-radius:20px;border:3px solid #00AFF0;opacity:0;animation:ring 2.6s ease-out infinite;}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.18);opacity:0}}
#of .mark{width:58px;height:34px;flex:none;}
#of .tx{display:flex;flex-direction:column;line-height:1.08;}
#of .brand{font-size:14px;font-weight:800;letter-spacing:-.2px;}
#of .brand .o{color:#0a1f2e;}
#of .brand .f{color:#00AFF0;}
#of .user{font-size:20px;font-weight:900;color:#0a1f2e;letter-spacing:-.3px;}
#of .free{margin-left:8px;background:#00AFF0;color:#fff;font-weight:900;font-size:12px;padding:4px 11px;border-radius:999px;box-shadow:0 0 10px rgba(0,175,240,.7);}
</style></head><body>
<div id="stage">
  <div id="lp">
    <h1><span class="hrt">&#9829;</span>LOVENSE</h1>
    <div class="sub">TIP TO MAKE ME VIBE</div>
    <div class="hdr"><div class="ic">&#128176;</div><div class="ic">&#9201;</div><div class="ic">&#12336;&#65039;</div></div>
    <div class="row"><span class="tk">2 &#8211; 9</span><span class="sec">2s</span><span class="lvl"><i style="height:6px"></i><i style="height:9px"></i><i style="height:6px"></i></span></div>
    <div class="row"><span class="tk">10 &#8211; 49</span><span class="sec">5s</span><span class="lvl"><i style="height:7px"></i><i style="height:12px"></i><i style="height:7px"></i></span></div>
    <div class="row"><span class="tk">50 &#8211; 99</span><span class="sec">10s</span><span class="lvl"><i style="height:9px"></i><i style="height:15px"></i><i style="height:9px"></i></span></div>
    <div class="row"><span class="tk">100 &#8211; 300</span><span class="sec">15s</span><span class="lvl"><i style="height:12px"></i><i style="height:18px"></i><i style="height:12px"></i></span></div>
    <div class="row"><span class="tk">&#8805; 301</span><span class="sec">30s</span><span class="lvl"><i style="height:15px"></i><i style="height:20px"></i><i style="height:15px"></i></span></div>
  </div>
  <div id="cta">USE <span class="pink">PINK LINK</span><br>IN CHAT<br>FOR FREE SUB</div>
  <div id="of">
    <svg class="mark" viewBox="0 0 72 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#00AFF0" stroke-width="8"/>
      <circle cx="20" cy="20" r="4.5" fill="#00AFF0"/>
      <path d="M62 4 c-9 0 -14.5 5 -14.5 14 v2.5 h-5.5 v8 h5.5 v9.5 h9 v-9.5 h7 v-8 h-7 v-1.8 c0 -3 1.6 -4.6 5 -4.6 h2.5 V4.4 C66 4.1 64 4 62 4 z" fill="#00AFF0"/>
    </svg>
    <span class="tx"><span class="brand"><span class="o">Only</span><span class="f">Fans</span></span><span class="user">@alicerosex</span></span>
    <span class="free">FREE</span>
  </div>
</div>
</body></html>
