<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
html,body{width:1280px;height:720px;overflow:hidden;background:transparent;}
#stage{position:fixed;inset:0;}

/* ---- ONLYFANS BADGE (bottom-left, primary) ---- */
#of{position:absolute;left:24px;bottom:86px;display:inline-flex;align-items:center;gap:13px;padding:12px 24px 12px 16px;border-radius:18px;white-space:nowrap;background:#fff;box-shadow:0 7px 24px rgba(0,150,214,.55);animation:float 2.8s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
#of::after{content:"";position:absolute;inset:-3px;border-radius:20px;border:3px solid #00AFF0;opacity:0;animation:ring 2.8s ease-out infinite;}
@keyframes ring{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.16);opacity:0}}
#of .mark{width:58px;height:34px;flex:none;}
#of .tx{display:flex;flex-direction:column;line-height:1.08;}
#of .brand{font-size:14px;font-weight:800;letter-spacing:-.2px;}
#of .brand .o{color:#0a1f2e;}
#of .brand .f{color:#00AFF0;}
#of .user{font-size:20px;font-weight:900;color:#0a1f2e;letter-spacing:-.3px;}
#of .free{margin-left:8px;background:#00AFF0;color:#fff;font-weight:900;font-size:12px;padding:4px 11px;border-radius:999px;box-shadow:0 0 10px rgba(0,175,240,.7);}

/* ---- TELEGRAM PILL (bottom-left, under OF) ---- */
#tg{position:absolute;left:24px;bottom:24px;display:inline-flex;align-items:center;gap:10px;padding:9px 18px 9px 11px;border-radius:14px;white-space:nowrap;background:#fff;box-shadow:0 5px 16px rgba(41,169,235,.45);}
#tg svg{width:30px;height:30px;flex:none;}
#tg .tx{display:flex;flex-direction:column;line-height:1.05;}
#tg .brand{font-size:11px;font-weight:800;color:#29a9eb;letter-spacing:.2px;}
#tg .user{font-size:15px;font-weight:900;color:#0a1f2e;letter-spacing:-.2px;}
</style></head><body>
<div id="stage">
  <div id="of">
    <svg class="mark" viewBox="0 0 72 40" xmlns="http://www.w3.org/2000/svg">
      <circle cx="20" cy="20" r="14.5" fill="none" stroke="#00AFF0" stroke-width="8"/>
      <circle cx="20" cy="20" r="4.5" fill="#00AFF0"/>
      <path d="M62 4 c-9 0 -14.5 5 -14.5 14 v2.5 h-5.5 v8 h5.5 v9.5 h9 v-9.5 h7 v-8 h-7 v-1.8 c0 -3 1.6 -4.6 5 -4.6 h2.5 V4.4 C66 4.1 64 4 62 4 z" fill="#00AFF0"/>
    </svg>
    <span class="tx"><span class="brand"><span class="o">Only</span><span class="f">Fans</span></span><span class="user">@alicerosex</span></span>
    <span class="free">FREE</span>
  </div>
  <div id="tg">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="12" fill="#29a9eb"/>
      <path d="M5.4 11.7l11.3-4.4c.5-.2 1 .1.8.9l-1.9 9.1c-.1.6-.5.7-1 .4l-2.8-2.1-1.4 1.3c-.2.2-.3.3-.6.3l.2-3 5.2-4.7c.2-.2 0-.3-.3-.1L8.3 13 5.6 12.2c-.6-.2-.6-.6.1-.9z" fill="#fff"/>
    </svg>
    <span class="tx"><span class="brand">Telegram</span><span class="user">@alicerosex</span></span>
  </div>
</div>
</body></html>
